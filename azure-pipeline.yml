# Build da API Valence

trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  JAVA_VERSION: '21'
  ARTIFACT_NAME: 'valence-api'

stages:
  - stage: CI
    displayName: 'CI - Build e Testes'
    jobs:
      - job: Build
        displayName: 'Build e Testes'
        steps:
          - task: JavaToolInstaller@0
            displayName: 'Instalar Java $(JAVA_VERSION)'
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Maven@4
            displayName: 'Maven clean package com testes JUnit'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package'
              options: '-B'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Testes JUnit da API Valence'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: 'default'
              mavenVersionOption: 'Default'

          - task: CopyFiles@2
            displayName: 'Copiar o valence-api.jar'
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)/target'
              Contents: 'valence-api.jar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME)'

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar o artefato $(ARTIFACT_NAME)'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(ARTIFACT_NAME)'
              ArtifactName: '$(ARTIFACT_NAME)'
